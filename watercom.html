<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACRED_MIRRORS.EXE</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #008080;
            font-family: 'VT323', monospace;
            color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .window {
            width: 100%;
            max-width: 440px;
            background: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 2px 2px 0px #000;
            padding: 3px;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .title-bar-buttons button {
            background: #c0c0c0;
            border-top: 1px solid #dfdfdf;
            border-left: 1px solid #dfdfdf;
            border-right: 1px solid #404040;
            border-bottom: 1px solid #404040;
            width: 16px;
            height: 14px;
            font-size: 9px;
            line-height: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .window-body {
            padding: 6px;
        }

        .fieldset {
            border: 1px solid #808080;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding: 6px 8px;
            margin-bottom: 6px;
            background: #c0c0c0;
        }

        .fieldset legend {
            padding: 0 5px;
            font-size: 1rem;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            text-align: center;
            padding-top: 2px;
        }

        .time-box span {
            display: block;
            font-size: 1.6rem;
            background: #fff;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding: 2px 4px;
            min-width: 38px;
        }

        .time-box label {
            font-size: 0.75rem;
            color: #404040;
        }

        .player-box {
            background: #000;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding: 6px;
            color: #00ff00;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            font-size: 1.05rem;
            margin-bottom: 5px;
        }

        /* Эквалайзер */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 30px;
            background: #050505;
            border: 1px solid #333;
            padding: 3px;
            margin-bottom: 6px;
        }

        .eq-bar {
            flex: 1;
            background: #00ff00;
            height: 10%;
            transition: height 0.15s ease;
        }

        .eq-bar:nth-child(even) {
            background: #00cc00;
        }

        .player-controls {
            display: flex;
            gap: 5px;
        }

        .win-btn {
            background: #c0c0c0;
            border-top: 1px solid #dfdfdf;
            border-left: 1px solid #dfdfdf;
            border-right: 1px solid #404040;
            border-bottom: 1px solid #404040;
            padding: 8px 5px;
            text-align: center;
            text-decoration: none;
            color: #000;
            font-size: 1.15rem;
            display: block;
            cursor: pointer;
            font-family: 'VT323', monospace;
            width: 100%;
        }

        .win-btn:active {
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding: 9px 4px 7px 6px;
        }

        /* Форма сбора почты */
        .access-form {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .access-input {
            background: #fff;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding: 6px 5px;
            font-family: 'VT323', monospace;
            font-size: 1.15rem;
            color: #000;
            width: 100%;
            outline: none;
        }

        .access-status {
            font-size: 0.95rem;
            color: #008000;
            min-height: 0px;
            text-align: center;
            margin-top: 0px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        /* Блок с плавной сменой треков */
        .terminal-box {
            background: #000;
            border-top: 1px solid #404040;
            border-left: 1px solid #404040;
            border-right: 1px solid #dfdfdf;
            border-bottom: 1px solid #dfdfdf;
            padding: 6px 10px;
            color: #00ff00;
            font-size: 1.15rem;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .fading-track {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fading-track.visible {
            opacity: 1;
        }

        .fading-track::before {
            content: "♫ ";
            color: #00aa00;
        }

        /* Пасхальное окно при клике на крестик (экран ошибки) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 10px;
        }

        .modal-window {
            width: 100%;
            max-width: 320px;
            background: #c0c0c0;
            border-top: 2px solid #dfdfdf;
            border-left: 2px solid #dfdfdf;
            border-right: 2px solid #404040;
            border-bottom: 2px solid #404040;
            box-shadow: 2px 2px 0px #000;
            padding: 3px;
        }

        .modal-body {
            padding: 12px;
            text-align: center;
        }

        .modal-text {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="window" id="mainWindow">
        <div class="title-bar">
            <span>SACRED_MIRRORS.EXE</span>
            <div class="title-bar-buttons">
                <button>_</button>
                <button>□</button>
                <button onclick="closeMainWindow()">×</button>
            </div>
        </div>
        <div class="window-body">
            
            <div class="fieldset">
                <legend>Release_Timer.exe</legend>
                <div class="countdown" id="countdown">
                    <div class="time-box"><span id="days">00</span><label>Days</label></div>
                    <div class="time-box"><span id="hours">00</span><label>Hours</label></div>
                    <div class="time-box"><span id="minutes">00</span><label>Min</label></div>
                    <div class="time-box"><span id="seconds">00</span><label>Sec</label></div>
                </div>
            </div>

            <div class="fieldset">
                <legend>Audio_Player.exe</legend>
                <div class="player-box">
                    <div class="player-info">
                        <span>[ Waiting Room ]</span>
                        <span id="play-state">STOP</span>
                    </div>
                    <!-- Эквалайзер -->
                    <div class="equalizer" id="eq">
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                        <div class="eq-bar"></div>
                    </div>
                    <!-- Аудио элемент с зацикливанием -->
                    <audio id="audioTrack" src="waiting_room.mp3" preload="auto" loop></audio>
                    
                    <div class="player-controls">
                        <button class="win-btn" id="playBtn" onclick="togglePlay()">Start</button>
                    </div>
                </div>
            </div>

            <!-- Форма раннего доступа -->
            <div class="fieldset">
                <legend>Early_Access.exe</legend>
                <form class="access-form" action="https://formspree.io/f/mqervarl" method="POST" id="accessForm" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" name="message" value="New early access request for 'Sacred Mirrors' album pre-listening! User requested exclusive pre-release access.">
                    <input type="email" name="email" class="access-input" placeholder="Enter your email..." required>
                    <button type="submit" class="win-btn">Request Early Access</button>
                    <div class="access-status" id="formStatus"></div>
                </form>
            </div>

            <!-- Треклист с эффектом появления/исчезновения -->
            <div class="fieldset">
                <legend>Tracklist.exe</legend>
                <div class="terminal-box">
                    <div class="fading-track visible" id="trackDisplay">Interlude</div>
                </div>
            </div>

            <div class="fieldset">
                <legend>Links.exe</legend>
                <div class="links-grid">
                    <a href="https://band.link/sacredmirrors" target="_blank" class="win-btn">Bandlink</a>
                    <a href="https://genius.com/artists/Waterai" target="_blank" class="win-btn">Genius</a>
                    <a href="https://soundcloud.com/water-ai" target="_blank" class="win-btn">SoundCloud</a>
                    <a href="https://www.instagram.com/watercomai?igsh=OTViNHFnbHhzcXVo" target="_blank" class="win-btn">Instagram</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Окно ошибки при клике на крестик с переходом на SoundCloud -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal-window">
            <div class="title-bar">
                <span>CRITICAL_ERROR.EXE</span>
                <div class="title-bar-buttons">
                    <button>×</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="modal-text">Fatal Error: Session terminated. Player is offline. Listen on SoundCloud instead:</div>
                <a href="https://on.soundcloud.com/wlUdhm7EQ37Y8ldEX9" target="_blank" class="win-btn">Play on SoundCloud</a>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("2026-08-08T00:00:00+03:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById("countdown").innerHTML = "<b>RELEASED</b>";
                return;
            }

            document.getElementById("days").innerText = String(Math.floor(distance / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById("hours").innerText = String(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById("minutes").innerText = String(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById("seconds").innerText = String(Math.floor((distance % (1000 * 60)) / 1000)).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Логика плеера и эквалайзера
        let isPlaying = false;
        let eqInterval = null;
        const bars = document.querySelectorAll('.eq-bar');
        const audio = document.getElementById('audioTrack');

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById("play-state").innerText = isPlaying ? "PLAY" : "PAUSE";
            document.getElementById("playBtn").innerText = isPlaying ? "Pause" : "Start";
            
            if (isPlaying) {
                audio.play().catch(e => console.log("Audio play error:", e));
                eqInterval = setInterval(() => {
                    bars.forEach(bar => {
                        let randomHeight = Math.floor(Math.random() * 95) + 5;
                        bar.style.height = randomHeight + '%';
                    });
                }, 120);
            } else {
                audio.pause();
                clearInterval(eqInterval);
                bars.forEach(bar => bar.style.height = '10%');
            }
        }

        // Клик на крестик: закрывает плеер и показывает не закрывающееся окно ошибки с кнопкой на SoundCloud
        function closeMainWindow() {
            // Останавливаем музыку
            if (isPlaying) {
                togglePlay();
            }
            // Скрываем главное окно
            document.getElementById('mainWindow').style.display = 'none';
            // Показываем окно критической ошибки
            document.getElementById('errorModal').style.display = 'flex';
        }

        // Логика последовательной смены треков с затуханием и появлением
        const tracks = [
            "Interlude",
            "in search of aliens",
            "exodream",
            "ganymede",
            "trip of noise",
            "imhome (BadTrip Suite, Pt. 1), Op. 3",
            "dr seraphim (BadTrip Suite, Pt. 2), Op. 3",
            "time to sleep",
            "disconnect"
        ];
        let currentTrackIndex = 0;
        const trackDisplay = document.getElementById('trackDisplay');

        function rotateTracks() {
            trackDisplay.classList.remove('visible');

            setTimeout(() => {
                currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
                trackDisplay.innerText = tracks[currentTrackIndex];
                trackDisplay.classList.add('visible');
            }, 600);
        }

        setInterval(rotateTracks, 3500);

        // Отправка формы через AJAX
        async function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const status = document.getElementById("formStatus");
            const data = new FormData(form);

            status.style.color = "#000";
            status.innerText = "Sending request...";

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'json'
                    }
                });

                if (response.ok) {
                    status.style.color = "#008000";
                    status.innerText = "Request received! Check your inbox soon.";
                    form.reset();
                } else {
                    status.style.color = "#800000";
                    status.innerText = "Submission error.";
                }
            } catch (error) {
                status.style.color = "#800000";
                status.innerText = "Connection error.";
            }
        }
    </script>
</body>
</html>
